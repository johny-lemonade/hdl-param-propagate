name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install tools
        run: python -m pip install yapf==0.43.0 pyflakes
      - name: Formatting (yapf)
        run: yapf --diff --recursive hdl_param_propagate tests hdl-param-propagate.py
      - name: Static checks (pyflakes)
        run: pyflakes hdl_param_propagate tests hdl-param-propagate.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -v -rs --ignore=tests/test_simulators.py

  simulators:
    name: HDL simulators (iverilog, verilator, ghdl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator ghdl
          iverilog -V 2>&1 | head -n 1
          verilator --version
          ghdl --version | head -n 1
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run simulator tests
        env:
          REQUIRE_SIMULATORS: '1'
        run: python -m pytest -v -rs tests/test_simulators.py
